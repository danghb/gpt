name: Probe WeChat URL Links

on:
  push:
    branches: [ "probe/wxaurl-links" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe candidate links
        shell: bash
        run: |
          set +e
          urls=(
            "https://wxaurl.cn/tIhrCxgH5Kb"
            "https://wxaurl.cn/UOdOAJrVwan"
            "https://wxaurl.cn/k9RqtoN7hJr"
            "https://wxaurl.cn/IhB2TOvurDv"
            "https://wxaurl.cn/YcKvT6jRmzv"
            "https://wxaurl.cn/xEoLSZ0xJIc"
            "https://wxaurl.cn/7RlpqGHfQ8h"
            "https://wxaurl.cn/M0qyMy2ArXo"
            "https://wxaurl.cn/rB6aPDnl95r"
            "https://wxaurl.cn/9JHGjdJl7fd"
            "https://wxaurl.cn/LOT7BAoWd6c"
            "https://wxaurl.cn/bg5JW99T7rm"
            "https://wxaurl.cn/K5TeBdt2dtn"
            "https://wxaurl.cn/In58pu1KAZb"
          )
          for u in "${urls[@]}"; do
            echo "===== $u ====="
            rm -f /tmp/h /tmp/b
            curl -A "Mozilla/5.0 (Linux; Android 14)"               --connect-timeout 8 --max-time 20               -sS -L -D /tmp/h -o /tmp/b               -w "http_code=%{http_code}\nurl_effective=%{url_effective}\nremote_ip=%{remote_ip}\ncontent_type=%{content_type}\nredirects=%{num_redirects}\n"               "$u"
            rc=$?
            echo "curl_rc=$rc"
            echo "--- headers tail ---"
            tail -n 20 /tmp/h 2>/dev/null
            echo "--- body preview ---"
            head -c 800 /tmp/b 2>/dev/null | tr '\n' ' '
            echo
            echo
          done
