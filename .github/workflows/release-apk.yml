name: Publish APK Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test NFC protocol
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WeChatNfcHce-v1.0.0.apk

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0"
          APK="WeChatNfcHce-v1.0.0.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK"               --target "$GITHUB_SHA"               --title "WeChat NFC HCE v1.0.0"               --notes "Android NFC HCE 测试工具：模拟 NFC Forum Type 4 NDEF 标签，用于测试 NFC 拉起微信小程序。"
          fi
